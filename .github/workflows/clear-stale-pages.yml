name: Clear stale Pages deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/clear-stale-pages.yml]
permissions:
  pages: write
jobs:
  clear-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the deployment blocking publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/salmanyoussef/salmanyoussef.github.io/pages/deployments/967031d9234a1e618d1330c6fd61239fa3057bab/cancel
